[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-sdk"
version = "0.1.0"
description = "Dependency-free Python SDK for the AURORA/Prism MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AURORA-NEURO" }]
dependencies = []

[project.scripts]
aurora-agent = "prism_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
