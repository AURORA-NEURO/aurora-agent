<text x="16.00" y="501.00" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1a1a1a">cell number counts admissible strategies excluding full-context, which is admissible by construction</text>
<text x="16.00" y="526.00" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">The other WorldSpec knobs — skeleton, events, protected set, decision time, policy — are deliberately not swept: they</text>
<text x="16.00" y="539.00" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">change what the decision is, not the structure around it, and a sweep that varied them would be comparing strategies</text>
<text x="16.00" y="552.00" font-family="system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8a8a8a">across different questions.</text>
