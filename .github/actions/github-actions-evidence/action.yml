name: Aurora GitHub Actions evidence
description: Export bounded GitHub Actions run/job data into Aurora's provider-normalization payload shape
author: AURORA-NEURO
inputs:
  checks:
    description: JSON file containing an array or object of bounded job/check rows
    required: false
  discover:
    description: Discover the selected GitHub Actions run and jobs through the GitHub API
    required: false
    default: 'false'
  github-token:
    description: Token used only for bounded GitHub API discovery; never copied into the payload
    required: false
    default: ${{ github.token }}
  api-url:
    description: GitHub API base URL; defaults to the current runner's API endpoint
    required: false
    default: ${{ github.api_url }}
  repository:
    description: owner/name repository to inspect; defaults to the current repository
    required: false
    default: ${{ github.repository }}
  output:
    description: Path for the deterministic provider payload artifact
    required: false
    default: .aurora/github-actions-provider-payload.json
  event:
    description: Optional GitHub event JSON path; defaults to GITHUB_EVENT_PATH
    required: false
    default: ''
  run-id:
    description: Optional run id; defaults to event metadata or GITHUB_RUN_ID
    required: false
    default: ''
  conclusion:
    description: Optional run conclusion; defaults to event metadata
    required: false
    default: ''
  run-url:
    description: Optional run URL; defaults to GitHub repository/run environment variables
    required: false
    default: ''
outputs:
  payload-path:
    description: Path to the emitted canonical provider payload
    value: ${{ steps.export.outputs['payload-path'] }}
  payload-digest:
    description: SHA-256 digest over the canonical payload bytes
    value: ${{ steps.export.outputs['payload-digest'] }}
  run-id:
    description: Exported provider run id
    value: ${{ steps.export.outputs['run-id'] }}
  check-count:
    description: Number of exported bounded job rows
    value: ${{ steps.export.outputs['check-count'] }}
  discovery-mode:
    description: Whether the payload used manual rows or GitHub API discovery
    value: ${{ steps.export.outputs['discovery-mode'] }}
runs:
  using: composite
  steps:
    - id: export
      name: Export bounded provider payload
      shell: bash
      env:
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_DISCOVER: ${{ inputs.discover }}
        INPUT_API_URL: ${{ inputs['api-url'] }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        GITHUB_TOKEN: ${{ inputs['github-token'] }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_EVENT: ${{ inputs.event }}
        INPUT_RUN_ID: ${{ inputs['run-id'] }}
        INPUT_CONCLUSION: ${{ inputs.conclusion }}
        INPUT_RUN_URL: ${{ inputs['run-url'] }}
      run: |
        set -euo pipefail
        exporter=(
          python "$GITHUB_ACTION_PATH/../../../tools/github_actions_evidence.py"
          --event "$INPUT_EVENT"
          --run-id "$INPUT_RUN_ID"
          --conclusion "$INPUT_CONCLUSION"
          --run-url "$INPUT_RUN_URL"
          --output "$INPUT_OUTPUT"
          --github-output "$GITHUB_OUTPUT"
        )
        if [[ "$INPUT_DISCOVER" == "true" ]]; then
          exporter+=(
            --discover
            --api-url "$INPUT_API_URL"
            --repository "$INPUT_REPOSITORY"
          )
        elif [[ "$INPUT_DISCOVER" == "false" ]]; then
          exporter+=(--checks "$INPUT_CHECKS")
        else
          echo "github-actions-evidence: discover must be true or false" >&2
          exit 2
        fi
        "${exporter[@]}"
