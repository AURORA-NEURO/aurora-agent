name: Aurora GitHub Actions evidence
description: Export bounded GitHub Actions run, job, artifact, and evidence handoff data
author: AURORA-NEURO
inputs:
  checks:
    description: JSON file containing an array or object of bounded job/check rows
    required: false
  discover:
    description: Discover the selected GitHub Actions run and jobs through the GitHub API
    required: false
    default: 'false'
  collect-evidence:
    description: During discovery, collect bounded artifact metadata and job log locators
    required: false
    default: 'false'
  github-token:
    description: Token used only for bounded GitHub API discovery; never copied into the payload
    required: false
    default: ${{ github.token }}
  api-url:
    description: GitHub API base URL; defaults to the current runner's API endpoint
    required: false
    default: ${{ github.api_url }}
  repository:
    description: owner/name repository to inspect; defaults to the current repository
    required: false
    default: ${{ github.repository }}
  artifacts:
    description: Optional JSON artifact metadata/rows file for manual collection
    required: false
  logs:
    description: Optional JSON log rows file for manual collection
    required: false
  attestations:
    description: Optional caller-supplied JSON attestation rows file; never signature-verified here
    required: false
  ci:
    description: Optional CI plan JSON file required when emitting an exact provider-evidence request
    required: false
  output:
    description: Path for the deterministic provider payload artifact
    required: false
    default: .aurora/github-actions-provider-payload.json
  collection-output:
    description: Optional metadata collection envelope output path
    required: false
    default: ''
  evidence-output:
    description: Optional exact CiProviderEvidenceRequest output path; requires ci
    required: false
    default: ''
  event:
    description: Optional GitHub event JSON path; defaults to GITHUB_EVENT_PATH
    required: false
    default: ''
  run-id:
    description: Optional run id; defaults to event metadata or GITHUB_RUN_ID
    required: false
    default: ''
  conclusion:
    description: Optional run conclusion; defaults to event metadata
    required: false
    default: ''
  run-url:
    description: Optional run URL; defaults to GitHub repository/run environment variables
    required: false
    default: ''
outputs:
  payload-path:
    description: Path to the emitted canonical provider payload
    value: ${{ steps.export.outputs['payload-path'] }}
  payload-digest:
    description: SHA-256 digest over the canonical payload bytes
    value: ${{ steps.export.outputs['payload-digest'] }}
  run-id:
    description: Exported provider run id
    value: ${{ steps.export.outputs['run-id'] }}
  check-count:
    description: Number of exported bounded job rows
    value: ${{ steps.export.outputs['check-count'] }}
  discovery-mode:
    description: Whether the payload used manual rows or GitHub API discovery
    value: ${{ steps.export.outputs['discovery-mode'] }}
  collection-path:
    description: Path to the optional metadata collection envelope
    value: ${{ steps.export.outputs['collection-path'] }}
  collection-digest:
    description: SHA-256 digest over the optional canonical collection envelope
    value: ${{ steps.export.outputs['collection-digest'] }}
  evidence-path:
    description: Path to the optional exact provider-evidence request
    value: ${{ steps.export.outputs['evidence-path'] }}
  evidence-digest:
    description: SHA-256 digest over the optional exact provider-evidence request
    value: ${{ steps.export.outputs['evidence-digest'] }}
  artifact-count:
    description: Number of exported artifact rows
    value: ${{ steps.export.outputs['artifact-count'] }}
  log-count:
    description: Number of exported log rows or locators
    value: ${{ steps.export.outputs['log-count'] }}
  attestation-count:
    description: Number of exported caller-supplied attestation rows
    value: ${{ steps.export.outputs['attestation-count'] }}
runs:
  using: composite
  steps:
    - id: export
      name: Export bounded provider payload
      shell: bash
      env:
        INPUT_CHECKS: ${{ inputs.checks }}
        INPUT_DISCOVER: ${{ inputs.discover }}
        INPUT_COLLECT_EVIDENCE: ${{ inputs['collect-evidence'] }}
        INPUT_API_URL: ${{ inputs['api-url'] }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_ARTIFACTS: ${{ inputs.artifacts }}
        INPUT_LOGS: ${{ inputs.logs }}
        INPUT_ATTESTATIONS: ${{ inputs.attestations }}
        INPUT_CI: ${{ inputs.ci }}
        GITHUB_TOKEN: ${{ inputs['github-token'] }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_COLLECTION_OUTPUT: ${{ inputs['collection-output'] }}
        INPUT_EVIDENCE_OUTPUT: ${{ inputs['evidence-output'] }}
        INPUT_EVENT: ${{ inputs.event }}
        INPUT_RUN_ID: ${{ inputs['run-id'] }}
        INPUT_CONCLUSION: ${{ inputs.conclusion }}
        INPUT_RUN_URL: ${{ inputs['run-url'] }}
      run: |
        set -euo pipefail
        exporter=(
          python "$GITHUB_ACTION_PATH/../../../tools/github_actions_evidence.py"
          --event "$INPUT_EVENT"
          --run-id "$INPUT_RUN_ID"
          --conclusion "$INPUT_CONCLUSION"
          --run-url "$INPUT_RUN_URL"
          --output "$INPUT_OUTPUT"
          --github-output "$GITHUB_OUTPUT"
        )
        if [[ "$INPUT_DISCOVER" == "true" ]]; then
          exporter+=(
            --discover
            --api-url "$INPUT_API_URL"
            --repository "$INPUT_REPOSITORY"
          )
          if [[ "$INPUT_COLLECT_EVIDENCE" == "true" ]]; then
            exporter+=(--collect-evidence)
          elif [[ "$INPUT_COLLECT_EVIDENCE" != "false" ]]; then
            echo "github-actions-evidence: collect-evidence must be true or false" >&2
            exit 2
          fi
        elif [[ "$INPUT_DISCOVER" == "false" ]]; then
          exporter+=(--checks "$INPUT_CHECKS")
          if [[ "$INPUT_COLLECT_EVIDENCE" == "true" ]]; then
            echo "github-actions-evidence: collect-evidence requires discover=true" >&2
            exit 2
          elif [[ "$INPUT_COLLECT_EVIDENCE" != "false" ]]; then
            echo "github-actions-evidence: collect-evidence must be true or false" >&2
            exit 2
          fi
        else
          echo "github-actions-evidence: discover must be true or false" >&2
          exit 2
        fi
        if [[ -n "$INPUT_ARTIFACTS" ]]; then exporter+=(--artifacts "$INPUT_ARTIFACTS"); fi
        if [[ -n "$INPUT_LOGS" ]]; then exporter+=(--logs "$INPUT_LOGS"); fi
        if [[ -n "$INPUT_ATTESTATIONS" ]]; then exporter+=(--attestations "$INPUT_ATTESTATIONS"); fi
        if [[ -n "$INPUT_CI" ]]; then exporter+=(--ci "$INPUT_CI"); fi
        if [[ -n "$INPUT_COLLECTION_OUTPUT" ]]; then exporter+=(--collection-output "$INPUT_COLLECTION_OUTPUT"); fi
        if [[ -n "$INPUT_EVIDENCE_OUTPUT" ]]; then exporter+=(--evidence-output "$INPUT_EVIDENCE_OUTPUT"); fi
        "${exporter[@]}"
