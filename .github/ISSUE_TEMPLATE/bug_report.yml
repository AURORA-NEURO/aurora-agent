name: Bug report
description: Report a defect in AURORA Agent (bioprism)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please paste certificates, verdicts, and error output
        **verbatim** — do not paraphrase or truncate them. The omission accounting in a
        certificate is often the diagnosis.

        For security vulnerabilities, do not open an issue; use GitHub Security
        Advisories on this repository instead (see SECURITY.md).
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: dropdown
    id: install-surface
    attributes:
      label: Install surface
      description: How you installed or ran AURORA Agent.
      options:
        - Claude Desktop .mcpb (Windows prebuilt)
        - Claude Code plugin marketplace
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: e.g. 0.1.1, or the commit hash for a source build.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: >-
        The exact command or MCP tool call, including all flags and arguments. For MCP,
        include the tool name and the arguments sent.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: >-
        Paste output verbatim: exit code, error envelope, and any certificate or verdict
        involved. If a Context Certificate is part of the report, include it whole.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >-
        World and query fixtures if shareable, and whether the behaviour reproduces on
        the shipped reference fixtures. On Windows, note whether the suite hit
        os error 4551 (see AGENTS.md — the binary never ran).
    validations:
      required: false
