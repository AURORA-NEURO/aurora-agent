name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fetch locked Rust dependencies
        run: cargo fetch --locked --config net.offline=false
      - name: validate glioma folder organization
        run: python tools/validate_glioma_organization.py
      # The repository predates this workflow and contains unrelated stable-rustfmt drift.
      # Keep the gate actionable by checking every Rust file changed by this revision while
      # the existing baseline is migrated deliberately rather than hiding the result.
      - name: format changed Rust files
        env:
          CHECK_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse "$CHECK_SHA^1")"
          mapfile -t changed_rust_files < <(git diff --name-only "$base_sha" "$CHECK_SHA" -- '*.rs')
          rust_files=()
          for file in "${changed_rust_files[@]}"; do
            # Deletions are valid revisions but are not valid rustfmt inputs.
            if [[ -f "$file" ]]; then
              rust_files+=("$file")
            fi
          done
          if ((${#rust_files[@]} == 0)); then
            echo "No Rust files changed in this revision."
            exit 0
          fi
          # lib.rs declares legacy child modules; skip_children keeps this revision gate scoped
          # to the changed source file instead of reformatting the entire historical crate.
          rustfmt --edition 2021 --check --config skip_children=true "${rust_files[@]}"
      - name: clippy
        # This legacy CLI query mirrors eight independently filterable flags;
        # keep all other warnings as errors while documenting the one known
        # pre-existing fan-out exception.
        run: cargo clippy --workspace --all-targets --locked --config net.offline=false -- -D warnings -A clippy::too_many_arguments
      - name: test
        env:
          # The expanded cross-domain catalogue makes some JSON-heavy API integration tests
          # exceed the platform default test-thread stack; keep the test contract unchanged.
          RUST_MIN_STACK: 8388608
        run: cargo test --workspace --locked --config net.offline=false

  parity:
    name: cross-language parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch locked Rust dependencies
        run: cargo fetch --locked --config net.offline=false
      # The certificate digest must match across CPython, the eager path and the indexed store.
      # A divergence here means a certificate produced by one implementation cannot be replayed
      # by another, which is the guarantee the whole scheme rests on.
      - name: regenerate golden artifacts from the CPython reference
        run: python tools/regenerate_golden.py
      - name: fail if the reference output drifted
        run: git diff --exit-code fixtures/
      - name: rust must reproduce them byte for byte
        run: cargo test -p bioprism-ids -p bioprism-fiber -p bioprism-store

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install Python test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: compile SDK and tests
        working-directory: python
        run: python -m compileall -q prism_sdk tests
      - name: run stdio client contract tests
        working-directory: python
        run: python -W error::ResourceWarning -m pytest -q
      - name: enforce autonomous selection promotion gate
        working-directory: python
        run: python -m pytest -q tests/test_autonomous_selection_promotion.py tests/test_autonomous_selection_lifecycle.py
      - name: test GitHub Actions evidence exporter
        working-directory: .
        run: python -m pytest -q tools/test_github_actions_evidence.py
      - name: exercise reusable GitHub Actions evidence action
        id: github-actions-evidence
        uses: ./.github/actions/github-actions-evidence
        with:
          checks: tools/fixtures/github-actions-checks.json
          artifacts: tools/fixtures/github-actions-artifacts.json
          logs: tools/fixtures/github-actions-logs.json
          attestations: tools/fixtures/github-actions-attestations.json
          ci: tools/fixtures/github-actions-ci.json
          output: ${{ runner.temp }}/aurora-github-actions-provider-payload.json
          collection-output: ${{ runner.temp }}/aurora-github-actions-collection.json
          evidence-output: ${{ runner.temp }}/aurora-github-actions-request.json
          run-id: ci-fixture-run
          conclusion: success
          run-url: https://example.invalid/aurora/ci-fixture-run
      - name: verify reusable action artifact and outputs
        env:
          AURORA_PAYLOAD_PATH: ${{ steps.github-actions-evidence.outputs['payload-path'] }}
          AURORA_PAYLOAD_DIGEST: ${{ steps.github-actions-evidence.outputs['payload-digest'] }}
          AURORA_RUN_ID: ${{ steps.github-actions-evidence.outputs['run-id'] }}
          AURORA_CHECK_COUNT: ${{ steps.github-actions-evidence.outputs['check-count'] }}
          AURORA_COLLECTION_PATH: ${{ steps.github-actions-evidence.outputs['collection-path'] }}
          AURORA_EVIDENCE_PATH: ${{ steps.github-actions-evidence.outputs['evidence-path'] }}
          AURORA_ARTIFACT_COUNT: ${{ steps.github-actions-evidence.outputs['artifact-count'] }}
          AURORA_LOG_COUNT: ${{ steps.github-actions-evidence.outputs['log-count'] }}
          AURORA_ATTESTATION_COUNT: ${{ steps.github-actions-evidence.outputs['attestation-count'] }}
          AURORA_DOWNLOAD_MODE: ${{ steps.github-actions-evidence.outputs['download-mode'] }}
          AURORA_DOWNLOADED_ARTIFACT_COUNT: ${{ steps.github-actions-evidence.outputs['downloaded-artifact-count'] }}
          AURORA_DOWNLOADED_LOG_COUNT: ${{ steps.github-actions-evidence.outputs['downloaded-log-count'] }}
          AURORA_DOWNLOADED_BYTE_COUNT: ${{ steps.github-actions-evidence.outputs['downloaded-byte-count'] }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload_path = Path(os.environ["AURORA_PAYLOAD_PATH"])
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          canonical = json.dumps(
              payload, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          assert payload["provider"] == "github_actions"
          assert payload["run"]["id"] == os.environ["AURORA_RUN_ID"] == "ci-fixture-run"
          assert len(payload["jobs"]) == int(os.environ["AURORA_CHECK_COUNT"]) == 2
          assert hashlib.sha256(canonical).hexdigest() == os.environ["AURORA_PAYLOAD_DIGEST"]
          assert payload["jobs"][1]["conclusion"] == "skipped"
          collection_path = Path(os.environ["AURORA_COLLECTION_PATH"])
          collection = json.loads(collection_path.read_text(encoding="utf-8"))
          assert collection["schema"].endswith("evidence-collection/0.1")
          assert collection["collection"]["verification"] == "metadata_only"
          assert collection["collection"]["attestations"] == "caller_supplied"
          assert len(collection["artifacts"]) == int(os.environ["AURORA_ARTIFACT_COUNT"]) == 1
          assert len(collection["logs"]) == int(os.environ["AURORA_LOG_COUNT"]) == 1
          assert len(collection["attestations"]) == int(os.environ["AURORA_ATTESTATION_COUNT"]) == 1
          assert os.environ["AURORA_DOWNLOAD_MODE"] == "disabled"
          assert int(os.environ["AURORA_DOWNLOADED_ARTIFACT_COUNT"]) == 0
          assert int(os.environ["AURORA_DOWNLOADED_LOG_COUNT"]) == 0
          assert int(os.environ["AURORA_DOWNLOADED_BYTE_COUNT"]) == 0
          assert "token" not in json.dumps(collection).lower()
          evidence_path = Path(os.environ["AURORA_EVIDENCE_PATH"])
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          assert evidence["source"] == "caller_attested"
          assert evidence["ci"]["checks"][0]["name"] == "unit"
          assert evidence["artifacts"][0]["run_id"] == "ci-fixture-run"
          print(f"verified {payload_path}, {collection_path}, and {evidence_path}")
          PY
      - name: exercise GitHub API evidence discovery
        id: github-actions-evidence-discovery
        uses: ./.github/actions/github-actions-evidence
        with:
          discover: 'true'
          collect-evidence: 'true'
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          output: ${{ runner.temp }}/aurora-github-actions-discovered-payload.json
          collection-output: ${{ runner.temp }}/aurora-github-actions-discovered-collection.json
      - name: verify discovered evidence artifact and outputs
        env:
          AURORA_DISCOVERED_PATH: ${{ steps.github-actions-evidence-discovery.outputs['payload-path'] }}
          AURORA_DISCOVERED_MODE: ${{ steps.github-actions-evidence-discovery.outputs['discovery-mode'] }}
          AURORA_DISCOVERED_COUNT: ${{ steps.github-actions-evidence-discovery.outputs['check-count'] }}
          AURORA_DISCOVERED_COLLECTION: ${{ steps.github-actions-evidence-discovery.outputs['collection-path'] }}
          AURORA_DISCOVERED_ARTIFACT_COUNT: ${{ steps.github-actions-evidence-discovery.outputs['artifact-count'] }}
          AURORA_DISCOVERED_LOG_COUNT: ${{ steps.github-actions-evidence-discovery.outputs['log-count'] }}
          AURORA_DISCOVERED_DOWNLOAD_MODE: ${{ steps.github-actions-evidence-discovery.outputs['download-mode'] }}
          AURORA_DISCOVERED_DOWNLOADED_BYTE_COUNT: ${{ steps.github-actions-evidence-discovery.outputs['downloaded-byte-count'] }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload_path = Path(os.environ["AURORA_DISCOVERED_PATH"])
          payload = json.loads(payload_path.read_text(encoding="utf-8"))
          assert os.environ["AURORA_DISCOVERED_MODE"] == "github_api"
          assert payload["provider"] == "github_actions"
          assert payload["run"]["id"] == "${{ github.run_id }}"
          assert len(payload["jobs"]) == int(os.environ["AURORA_DISCOVERED_COUNT"]) > 0
          assert "token" not in json.dumps(payload).lower()
          collection_path = Path(os.environ["AURORA_DISCOVERED_COLLECTION"])
          collection = json.loads(collection_path.read_text(encoding="utf-8"))
          assert collection["collection"]["run_metadata"] == "github_api"
          assert collection["collection"]["artifact_metadata"] == "github_api"
          assert collection["collection"]["log_metadata"] == "job_log_locators"
          assert collection["collection"]["attestations"] == "not_requested"
          assert len(collection["artifacts"]) == int(os.environ["AURORA_DISCOVERED_ARTIFACT_COUNT"])
          assert len(collection["logs"]) == int(os.environ["AURORA_DISCOVERED_LOG_COUNT"])
          assert os.environ["AURORA_DISCOVERED_DOWNLOAD_MODE"] == "disabled"
          assert int(os.environ["AURORA_DISCOVERED_DOWNLOADED_BYTE_COUNT"]) == 0
          assert "token" not in json.dumps(collection).lower()
          print(f"verified discovered {payload_path} and {collection_path} ({len(payload['jobs'])} jobs)")
          PY

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: install locked dependencies
        working-directory: typescript
        run: npm ci --ignore-scripts
      - name: build and run contract tests
        working-directory: typescript
        run: npm test
      - name: enforce autonomous selection promotion gate
        working-directory: typescript
        run: node --test test/autonomous-selection-promotion.test.mjs test/autonomous-selection-lifecycle.test.mjs
